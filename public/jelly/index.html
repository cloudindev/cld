<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jelly cloud · demo</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="jelly.css">
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: grid; place-items: center;
      background: #F4F2EC;
      font: 14px/1.4 system-ui, sans-serif; color: #6b6a64;
    }
    .stage { width: min(78vw, 640px); }
    .hint { position: fixed; bottom: 16px; left: 0; right: 0; text-align: center; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="jelly" id="cloud">
      <img class="jelly-img" src="cloud.webp" alt="Nube de gominola azul translúcida">
    </div>
  </div>
  <p class="hint">Pasa el ratón o toca la nube para animarla · arrástrala con el ratón · <a href="#" onclick="jelly.reset();return false">devolverla a su sitio</a></p>
  <script type="module">
    import { createJelly } from './jelly.js';
    window.jelly = createJelly(document.getElementById('cloud'));
  </script>
</body>
</html>
